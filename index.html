<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>КЛТ — Рейтинг</title>
  <style>
    :root{
      --bg:#0b1020;
      --text:#eaf0ff;
      --muted:#a9b4d6;
      --accent:#7c5cff;
      --accent2:#21d4ff;
      --ok:#25c26e;
      --warn:#f6c343;
      --bad:#ff4d6d;
      --border:rgba(255,255,255,.10);
      --shadow: 0 14px 40px rgba(0,0,0,.35);
      --r: 18px;
      --r2: 26px;
      --max: 1120px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 25% -10%, rgba(124,92,255,.35), transparent 55%),
        radial-gradient(900px 500px at 85% 0%, rgba(33,212,255,.22), transparent 55%),
        linear-gradient(180deg, #070a14 0%, var(--bg) 40%, #070a14 100%);
      min-height:100vh;
    }
    a{color:inherit; text-decoration:none}
    .wrap{max-width:var(--max); margin:0 auto; padding:24px}
    .topbar{
      position:sticky; top:0; z-index:20;
      backdrop-filter: blur(10px);
      background: rgba(7,10,20,.65);
      border-bottom: 1px solid var(--border);
    }
    .nav{
      display:flex; align-items:center; justify-content:space-between;
      gap:12px;
      max-width:var(--max); margin:0 auto; padding:14px 24px;
    }
    .brand{display:flex; align-items:center; gap:10px; font-weight:900; letter-spacing:.2px;}
    .logo{
      width:38px; height:38px; border-radius:12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 10px 25px rgba(124,92,255,.25);
    }
    .logoImg{
  width:40px;
  height:40px;
  border-radius:12px;
  display:block;
  filter: drop-shadow(0 10px 18px rgba(0,0,0,.35));
  transform: translateZ(0);
}
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      gap:10px; padding:12px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.10);
color: var(--text);
      font-weight:1000;
      box-shadow: 0 14px 35px rgba(124,92,255,.25);
      transition:.15s ease;
      cursor:pointer;
      user-select:none;
      white-space: nowrap;
    }
    .btn:hover{
  transform: translateY(-1px);
  border-color: rgba(255,255,255,.28);
  background: rgba(255,255,255,.14);
}
    .btn.secondary{
      background: rgba(255,255,255,.03);
      color: var(--text);
      border-color: rgba(255,255,255,.16);
      box-shadow:none;
      font-weight:900;
    }

    .card{
      background: rgba(255,255,255,.03);
      border:1px solid var(--border);
      border-radius: var(--r2);
      box-shadow: var(--shadow);
    }
    .crumbs{color:var(--muted); font-weight:900; font-size:12px; text-transform:uppercase; letter-spacing:.22px}
    .pageTitle{margin:6px 0 8px; font-size:28px; letter-spacing:-.4px}

    input[type="text"]{
      padding:12px 14px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(8,12,24,.55);
      color: var(--text);
      font-weight:1000;
      letter-spacing:.6px;
      outline:none;
      min-width: 240px;
    }
    input[type="text"]::placeholder{color: rgba(169,180,214,.65); letter-spacing:.2px}
    .formRow{display:flex; gap:10px; flex-wrap:wrap; align-items:center}

    .notice{
      padding:12px 14px;
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.03);
      color:var(--muted);
      font-weight:800;
      line-height:1.5;
      margin-top:12px;
    }
    .notice.ok{border-color: rgba(37,194,110,.35)}
    .notice.bad{border-color: rgba(255,77,109,.35)}
    .notice.expelled{
      border-color: rgba(255,77,109,.75);
      background: rgba(255,77,109,.12);
      color: rgba(255,220,226,.98);
    }

    .small{font-size:12px; color:var(--muted); font-weight:800}
    .muted{color:var(--muted)}
    .divider{height:1px; background: var(--border); margin:14px 0}

    .kpiGrid{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:10px;
      margin-top:12px;
    }
    .kpi{
      padding:12px;
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03);
    }
    .kpi .k{color:var(--muted); font-weight:900; font-size:12px}
    .kpi .v{font-weight:1100; font-size:18px; margin-top:6px}
    .kpi .c{color:var(--muted); font-weight:800; font-size:12px; margin-top:6px}

    .dash{
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap:12px;
      margin-top:12px;
    }

    .chartRow{
      display:grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap:12px;
      margin-top:12px;
      align-items:stretch;
    }

    .chartCard{
      padding:14px;
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03);
    }
    .chartTitle{font-weight:1000; margin:0 0 10px}
    canvas{width:100%; height:260px; display:block}
    #top3Chart{height:240px;}

    .table{
      width:100%;
      border-collapse: collapse;
      margin-top:12px;
      overflow:hidden;
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.02);
    }
    .table th, .table td{
      padding:10px 10px;
      border-bottom:1px solid rgba(255,255,255,.08);
      text-align:left;
      font-size: 13px;
      vertical-align: top;
    }
    .table th{color: var(--muted); font-weight:1000; letter-spacing:.2px}

    .badge{
      display:inline-flex; align-items:center; gap:6px;
      padding:6px 10px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.03);
      font-weight:1000;
      font-size:12px;
      white-space: nowrap;
    }
    .b-ok{border-color: rgba(37,194,110,.35)}
    .b-warn{border-color: rgba(246,195,67,.35)}
    .b-bad{border-color: rgba(255,77,109,.35)}

    .supportWrap{
      margin-top:14px;
      padding:14px 0 8px;
      border-top: 1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }
    .supportLink{
      color: rgba(234,240,255,.92);
      font-weight:1000;
      border-bottom: 1px dashed rgba(255,255,255,.28);
      cursor:pointer;
      user-select:none;
    }
    .supportBox{
      display:none;
      margin-top:10px;
      padding:12px 14px;
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.03);
      color: var(--muted);
      font-weight:800;
      line-height:1.6;
    }
    .supportBox a{
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ---- Pre-Input Slides (only when ID empty) ---- */
    .preIntro{
      margin-top:12px;
      display:grid;
      grid-template-columns: 1.1fr .9fr;
      gap:12px;
      align-items:stretch;
    }
    .preText{
      padding:18px;
    }
    .preText h3{margin:0 0 8px; font-size:18px; letter-spacing:-.2px}
    .preText p{margin:0; color:var(--muted); font-weight:800; line-height:1.6}
    .preSlider{
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .heroSlider{
      border-radius: 22px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.03);
      overflow:hidden;
      position:relative;
      min-height: 260px;
    }
    .heroSlide{
      position:absolute;
      inset:0;
      opacity:0;
      transition: opacity .6s ease;
    }
    .heroSlide.active{opacity:1;}
    .heroSlide img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
      filter:saturate(1.05);
      opacity:.92;
    }
    .heroSlider::after{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(900px 260px at 20% 0%, rgba(124,92,255,.22), transparent 55%),
        radial-gradient(700px 240px at 85% 20%, rgba(33,212,255,.14), transparent 60%),
        linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.42));
      pointer-events:none;
    }
    .heroOverlay{
      position:absolute;
      left:14px; right:14px; bottom:14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      z-index:2;
    }
    .heroCaption{
      padding:10px 12px;
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(7,10,20,.55);
      color: rgba(234,240,255,.92);
      font-weight:900;
      line-height:1.35;
    }
    .heroDots{display:flex; gap:8px; align-items:center;}
    .heroDot{
      width:9px; height:9px; border-radius:999px;
      border:1px solid rgba(255,255,255,.35);
      background: rgba(255,255,255,.10);
      cursor:pointer;
    }
    .heroDot.active{
      background: rgba(255,255,255,.85);
      border-color: rgba(255,255,255,.85);
    }

    @media (max-width: 980px){
      .kpiGrid{grid-template-columns: 1fr 1fr}
      .dash{grid-template-columns: 1fr}
      .chartRow{grid-template-columns: 1fr; grid-template-rows: auto;}
      .preIntro{grid-template-columns:1fr;}
    }
    @media (max-width: 520px){
      .kpiGrid{grid-template-columns: 1fr}
      input[type="text"]{ min-width: 0; width: 100%; }
      .formRow .btn{ width: 100%; }
      .heroSlider{min-height:220px;}
    }

    /* Mobile chart hard-fix */
    @media (max-width: 700px){
      .chartRow{
        grid-template-columns: 1fr !important;
        grid-template-rows: auto !important;
      }
      .chartCard{
        grid-column: auto !important;
        grid-row: auto !important;
      }
      .chartTitle{
        white-space: normal;
        word-break: break-word;
      }
      canvas{ max-width:100%; height:220px; display:block; }
      .table{ display:block; overflow-x:auto; -webkit-overflow-scrolling:touch; }
      .table th, .table td{ white-space: nowrap; }
    }

    /* prevents “vertical letters”/overlap */
    .card, .chartCard, .kpi, .notice { min-width: 0; }
    .dash, .chartRow, .kpiGrid { min-width: 0; }

    /* ── THEME TOGGLE SWITCH ─────────────────────────── */
    .themeSwitch{
      width:50px; height:28px; border-radius:99px;
      border:1px solid rgba(255,255,255,.22);
      background:rgba(255,255,255,.09);
      position:relative; cursor:pointer; padding:0;
      transition:.25s ease; flex-shrink:0;
      display:inline-flex; align-items:center;
    }
    .themeSwitch:hover{ border-color:rgba(255,255,255,.35); }
    body.light .themeSwitch{ background:rgba(91,63,255,.15); border-color:rgba(91,63,255,.35); }
    .tsBall{
      position:absolute; left:3px;
      width:22px; height:22px; border-radius:50%;
      background:#fff;
      display:flex; align-items:center; justify-content:center;
      font-size:13px; line-height:1;
      transition:.25s ease;
      box-shadow:0 2px 8px rgba(0,0,0,.30);
      pointer-events:none; user-select:none;
    }
    body.light .tsBall{ transform:translateX(22px); }

    /* ── LIGHT THEME ─────────────────────────────────── */
    body.light{
      --bg:#eef2ff;
      --text:#1a1f3e;
      --muted:#5a6485;
      --accent:#5b3fff;
      --accent2:#00b4d8;
      --ok:#1aaa5e;
      --warn:#c89200;
      --bad:#d40039;
      --border:rgba(0,0,0,.10);
      --shadow:0 8px 30px rgba(0,0,0,.09);
    }
    body.light{
      background:
        radial-gradient(1200px 600px at 25% -10%,rgba(91,63,255,.10),transparent 55%),
        radial-gradient(900px 500px at 85% 0%,rgba(0,180,216,.08),transparent 55%),
        linear-gradient(180deg,#dce5ff 0%,#eef2ff 40%,#dce5ff 100%);
    }
    body.light .topbar{background:rgba(220,229,255,.90);}
    body.light input[type=”text”]{background:rgba(255,255,255,.85);border-color:rgba(0,0,0,.15);color:#1a1f3e;}
    body.light .card,body.light .chartCard,body.light .kpi,
    body.light .notice,body.light .supportBox{
      background:rgba(255,255,255,.72); border-color:rgba(0,0,0,.09);
    }
    body.light .notice.expelled{
      background:rgba(212,0,57,.10);
      color:#7a001e;
      border-color:rgba(212,0,57,.45);
    }
    body.light .notice.ok{ border-color:rgba(26,170,94,.45); }
    body.light .heroSlider{background:rgba(255,255,255,.5);border-color:rgba(0,0,0,.10);}
    body.light .heroSlider::after{
      background:
        radial-gradient(900px 260px at 20% 0%,rgba(91,63,255,.08),transparent 55%),
        linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.18));
    }
    body.light .table{border-color:rgba(0,0,0,.09); background:rgba(255,255,255,.5);}
    body.light .table th,body.light .table td{border-bottom-color:rgba(0,0,0,.06);}
    body.light .badge{border-color:rgba(0,0,0,.09); background:rgba(0,0,0,.04);}
    body.light .b-ok{border-color:rgba(26,170,94,.50); background:rgba(26,170,94,.08); color:#0d7a3e;}
    body.light .b-warn{border-color:rgba(200,146,0,.50); background:rgba(200,146,0,.08); color:#7a5800;}
    body.light .b-bad{border-color:rgba(212,0,57,.50); background:rgba(212,0,57,.08); color:#8a001e;}
    body.light .btn{border-color:rgba(0,0,0,.15); background:rgba(0,0,0,.07); color:#1a1f3e; box-shadow:none;}
    body.light .btn:hover{background:rgba(0,0,0,.12);}
    body.light .crumbs{color:#5a6485;}
    body.light .heroCaption{background:rgba(230,237,255,.80); color:#1a1f3e;}
    body.light .heroDot{border-color:rgba(0,0,0,.25); background:rgba(0,0,0,.08);}
    body.light .heroDot.active{background:rgba(91,63,255,.75); border-color:rgba(91,63,255,.75);}
    body.light .muted{color:#5a6485;}
    body.light .small{color:#5a6485;}

    /* ── ADMIN MODAL ─────────────────────────────────── */
    .modal-overlay{
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,.62);
      backdrop-filter:blur(8px);
      z-index:200;
      align-items:center; justify-content:center;
    }
    .modal-overlay.show{display:flex;}
    .modal-box{
      background:rgba(11,16,32,.98);
      border:1px solid rgba(255,255,255,.15);
      border-radius:24px; padding:32px;
      width:360px; max-width:94vw;
      box-shadow:0 24px 64px rgba(0,0,0,.55);
    }
    body.light .modal-box{background:rgba(240,244,255,.98);border-color:rgba(0,0,0,.12);}
    .modal-box h3{margin:0 0 20px; font-size:20px; letter-spacing:-.3px; font-weight:1000;}
    .modal-input{
      width:100%; padding:12px 14px; display:block;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.15);
      background:rgba(255,255,255,.07);
      color:var(--text); font-size:15px; font-weight:800;
      font-family:inherit;
      outline:none; margin-bottom:10px; box-sizing:border-box;
    }
    body.light .modal-input{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.15);}
    .modal-input:focus{border-color:rgba(124,92,255,.55);}
    .modal-err{color:var(--bad);font-size:13px;font-weight:900;margin-bottom:10px;display:none;}
    .modal-err.show{display:block;}
    .modal-actions{display:flex;gap:8px;margin-top:4px;}

    /* ── ADMIN PANEL ─────────────────────────────────── */
    .adminCard{
      background:rgba(255,255,255,.03);
      border:1px solid var(--border);
      border-radius:var(--r2);
      box-shadow:var(--shadow);
    }
    body.light .adminCard{background:rgba(255,255,255,.72);}
    .adminTabs{
      display:flex; gap:6px; flex-wrap:wrap;
      padding:12px 16px 10px;
      border-bottom:1px solid var(--border);
    }
    .adminTab{
      display:flex; align-items:center; gap:6px;
      padding:7px 14px; border-radius:10px;
      border:1px solid transparent;
      font-weight:900; font-size:13px; cursor:pointer;
      color:var(--muted); transition:.15s; user-select:none;
    }
    .adminTab.active,.adminTab:hover{
      background:rgba(124,92,255,.15);
      border-color:rgba(124,92,255,.30);
      color:var(--text);
    }
    .adminContent{padding:16px;}
    .adminRow{display:grid;gap:10px;margin-bottom:10px;}
    .adminRow4{grid-template-columns:repeat(4,1fr);}
    .adminRow3{grid-template-columns:repeat(3,1fr);}
    .adminRow2{grid-template-columns:1.5fr 1fr;}
    .adminKpi{
      padding:16px; border-radius:16px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.03);
      min-width:0; position:relative; overflow:hidden;
    }
    body.light .adminKpi{background:rgba(255,255,255,.65);}
    /* accent left-border variants */
    .adminKpi.ap{ border-left:3px solid var(--accent); }
    .adminKpi.ac2{ border-left:3px solid var(--accent2); }
    .adminKpi.aok{ border-left:3px solid var(--ok); }
    .adminKpi.awk{ border-left:3px solid var(--warn); }
    .adminKpi.abd{ border-left:3px solid var(--bad); }
    .adminKpi .ak{
      font-size:11px;font-weight:900;color:var(--muted);
      text-transform:uppercase;letter-spacing:.3px;
      margin-bottom:8px;line-height:1.4;
    }
    .adminKpi .av{font-size:24px;font-weight:1100;letter-spacing:-.5px;line-height:1.1;margin-top:2px;}
    .adminKpi .ac{font-size:12px;color:var(--muted);font-weight:800;margin-top:6px;line-height:1.5;}
    .adminKpi .abar{height:6px;border-radius:99px;background:rgba(255,255,255,.10);margin-top:10px;overflow:hidden;}
    body.light .adminKpi .abar{background:rgba(0,0,0,.12);}
    .adminKpi .abar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.5s;}
    .adminEmoji{font-size:28px;display:block;margin-bottom:6px;line-height:1;}
    /* admin table */
    .adminTable{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px;}
    .adminTable th{color:var(--muted);font-weight:900;font-size:11px;text-transform:uppercase;
      letter-spacing:.2px;padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;}
    .adminTable td{padding:8px 8px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle;}
    body.light .adminTable td{border-bottom-color:rgba(0,0,0,.05);}
    .adminTable tr:last-child td{border-bottom:none;}
    .adminTbar{height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;min-width:60px;}
    body.light .adminTbar{background:rgba(0,0,0,.08);}
    .adminTbar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
    @media(max-width:980px){
      .adminRow4{grid-template-columns:1fr 1fr;}
      .adminRow3{grid-template-columns:1fr 1fr;}
      .adminRow2{grid-template-columns:1fr;}
    }
    @media(max-width:520px){
      .adminRow4,.adminRow3{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="nav">
      <a class="brand" href="#/rating" aria-label="КЛТ Рейтинг">
        <img class="logoImg" src="./img/logo.svg" alt="КЛТ" />
        <div>КЛТ <span class="muted">Рейтинг</span></div>
      </a>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="themeSwitch" id="themeToggle" title="Сменить тему" aria-label="Переключить тему">
          <span class="tsBall" id="themeBall">🌙</span>
        </button>
        <button class="btn secondary" id="adminBtn">⚙ Администратор</button>
        <a class="btn" href="#/rating" aria-label="Показать результаты">Результаты</a>
      </div>
    </div>
  </div>

  <!-- ── Admin Login Modal ─────────────────────── -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal-box">
      <h3>🔐 Панель администратора</h3>
      <input class="modal-input" type="text" id="adminLogin" placeholder="Логин" autocomplete="off" />
      <input class="modal-input" type="password" id="adminPass" placeholder="Пароль" />
      <div class="modal-err" id="adminErr">Неверный логин или пароль</div>
      <div class="modal-actions">
        <button class="btn" id="adminLoginBtn">Войти</button>
        <button class="btn secondary" id="adminCancelBtn">Отмена</button>
      </div>
    </div>
  </div>

  <main class="wrap" id="app" aria-live="polite"></main>

  <script>
    function baseNoHash(){
      const u = new URL(location.href);
      u.hash = "";
      u.search = "";
      return u.toString();
    }
    const DATA_URLS = {
      students: new URL("./site_students.csv", baseNoHash()).toString(),

    function parseISODateMaybe(s){
      const t = String(s ?? "").trim();
      if (!t) return null;

      const mISO = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (mISO){
        const yy = Number(mISO[1]);
        const mm = Number(mISO[2]);
        const dd = Number(mISO[3]);
        if (!Number.isFinite(yy) || !Number.isFinite(mm) || !Number.isFinite(dd)) return null;
        if (mm < 1 || mm > 12) return null;
        if (dd < 1 || dd > 31) return null;
        const d = new Date(yy, mm - 1, dd);
        if (isNaN(+d)) return null;
        if (d.getFullYear() !== yy || (d.getMonth()+1) !== mm || d.getDate() !== dd) return null;
        return d;
      }

      if (/^\d{2}\.\d{2}\.\d{4}$/.test(t)) {
        const [ddS, mmS, yyS] = t.split(".");
        const dd = Number(ddS), mm = Number(mmS), yy = Number(yyS);
        if (mm < 1 || mm > 12) return null;
        if (dd < 1 || dd > 31) return null;
        const d = new Date(yy, mm-1, dd);
        if (isNaN(+d)) return null;
        if (d.getFullYear() !== yy || (d.getMonth()+1) !== mm || d.getDate() !== dd) return null;
        return d;
      }

      const d = new Date(t);
      return isNaN(+d) ? null : d;
    }

    function formatDateRU(s){
      const raw = String(s ?? "").trim();

      if (!d) return "—";
      const dd = String(d.getDate()).padStart(2,"0");
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const yy = String(d.getFullYear());
      return `${dd}.${mm}.${yy}`;
    }

    function includesAny(hay, needles){
      const s = String(hay ?? "").toLowerCase();
      return needles.some(n => s.includes(String(n).toLowerCase()));
    }

    function detectDelimiter(firstLine){
      let comma = 0, semi = 0, tab = 0;
      let inQuotes = false;
      for (let i=0;i<firstLine.length;i++){
        const ch = firstLine[i];
        const next = firstLine[i+1];
        if (ch === '"' && inQuotes && next === '"'){ i++; continue; }
        if (ch === '"'){ inQuotes = !inQuotes; continue; }
        if (!inQuotes){
          if (ch === ",") comma++;
          else if (ch === ";") semi++;
          else if (ch === "\t") tab++;
        }
      }
      if (tab >= semi && tab >= comma) return "\t";
      if (semi >= comma) return ";";
      return ",";
    }

    function parseCSV(text){
      const clean = String(text ?? "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      const firstNonEmpty = clean.split("\n").find(l=>l.trim().length) || "";
      const delim = detectDelimiter(firstNonEmpty);

      const rows = [];
      let row = [];
      let cur = "";
      let inQuotes = false;

      for (let i=0;i<clean.length;i++){
        const ch = clean[i];
        const next = clean[i+1];

        if (ch === '"' && inQuotes && next === '"'){ cur += '"'; i++; continue; }
        if (ch === '"'){ inQuotes = !inQuotes; continue; }

        if (!inQuotes && ch === "\n"){
          row.push(cur);
          rows.push(row);
          row = [];
          cur = "";
          continue;
        }

        if (!inQuotes && ch === delim){
          row.push(cur);
          cur = "";
          continue;
        }

        cur += ch;
      }
      if (cur.length || row.length){
        row.push(cur);
        rows.push(row);
      }
      return rows.filter(r=> r.some(x=> String(x).trim().length));
    }

    const normalizeHeader = (h) =>
      String(h ?? "").replace(/^\uFEFF/, "").trim().toLowerCase();

    const findHeader = (arr, variants) => {

      return arr.findIndex(x=> set.includes(x));
    };

    function toNumberMaybe(v){
      const s = String(v ?? "").trim();
      if (!s) return null;
      const n = Number(s.replace(",", "."));

    }

    function isAttendanceValue(v){
      const s = String(v ?? "").trim();
      if (!s) return false;
      if (s === "С" || s === "c" || s === "C") return true;
      const n = toNumberMaybe(s);
      return n === 0 || n === -1 || n === 1;
    }

    function attendanceIsPresent(v){
      const s = String(v ?? "").trim();
      if (!s) return null;
      if (s === "С" || s === "c" || s === "C") return true;
      const n = toNumberMaybe(s);
      if (n === -1) return false;

      return null;
    }

    function eligibleForScoring(row){
  const a = String(row.score_or_attendance ?? "").trim();
  if (a !== "0") return false;

  const pr = String(row.place_or_result ?? "").trim();

  // ✅ если результата нет (пусто или прочерк) — баллы не считаем
  if (!pr || pr === "—" || pr === "-") return false;

  if (pr === "#Н/Д" || pr === "#N/A" || pr.toLowerCase().includes("н/д")) return false;
  return true;
}

    function normTournamentKey(name){
      const s = String(name ?? "").toLowerCase();
      if (s.includes("business") || s.includes("cats") || s.includes("бизнес")) return "Business Cats";
      if (s.includes("пейнтбол") || s.includes("paint")) return "Пейнтбол";
      if (s.includes("civilization") || s.includes("civ")){
        if (s.includes("duel") || s.includes("дуel") || s.includes("дуэль")) return "Civilization: DUEL";
        if (s.includes("ceo")) return "Civilization: CEO";
        return "Civilization: Solo";
      }
      if (s.includes("бенди") || s.includes("bandy")) return "Бенди";
      if (s.includes("feudal")) return "Life is Feudal";
      return (name || "—").trim() || "—";
    }

    function parsePlaceNumber(s){
      const txt = String(s ?? "").trim();
      if (!txt) return null;
      if (txt === "#Н/Д" || txt === "#N/A" || txt.toLowerCase().includes("н/д")) return null;
      const m = txt.match(/(\d{1,3})/);
      if (!m) return null;
      const n = Number(m[1]);
      return Number.isFinite(n) ? n : null;
    }

    function bcPointsFromPlace(place){
      const p = clamp(place, 1, 20);
      const score = Math.round(((20 - p) / 19) * 100);
      return clamp(score, 0, 100);
    }

    function parseYearFromRow(row){
      const s = [
        row.place_or_result,
        row.score_or_attendance,
        row.comment,
        row.extra,
        row.label,
        row.stage
      ].map(x=>String(x ?? "")).join(" ");
      const m = s.match(/(16\d{2}|17\d{2}|18\d{2})/);
      if (!m) return null;
      const y = Number(m[1]);
      return Number.isFinite(y) ? y : null;
    }

    /* ✅ CHANGED (CIV ONLY): detect revolution rows by label (year or "Не защитился") */
    function isCivRevolutionRow(row){
      const lbl = String(row.label ?? "").trim().toLowerCase();
      if (!lbl) return false;
      if (lbl.includes("не защит")) return true;
      return /(16\d{2}|17\d{2}|18\d{2})/.test(lbl);
    }

    function playoffRoundPoints(denom){
      const map = { 32:20, 16:30, 8:40, 4:60, 2:80 };
      return map[denom] ?? null;
    }
    function extractPlayoffDenom(text){
      const blob = String(text ?? "").toLowerCase();
      const m = blob.match(/1\s*[/\\]\s*(32|16|8|4|2)/);
      if (!m) return null;
      const denom = Number(m[1]);
      return Number.isFinite(denom) ? denom : null;
    }

    function civYearPointsFromYear(year){
      const best = 1652;
      const worst = 1800;
      const y = clamp(year, best, worst);
      const score = 100 - ((y - best) / (worst - best)) * 100;
      return clamp(Math.round(score), 0, 100);
    }

    function revolutionIsWin(row){
      const s = [
        row.place_or_result,
        row.score_or_attendance,
        row.comment,
        row.extra,
        row.label,
        row.stage
      ].map(x=>String(x ?? "")).join(" ").toLowerCase();

      if (includesAny(s, ["побед", "win", "лучший", "защит"])) return true;
      if (includesAny(s, ["проиг", "loss", "не защит", "выбыл"])) return false;
      return false;
    }

    function scoreSession(row){
      const t = normTournamentKey(row.tournament);
      const stage = String(row.stage || row.label || "").toLowerCase();
      const placeText = String(row.place_or_result || "").trim();
      const valText = String(row.score_or_attendance || "").trim();
      const comment = String(row.comment || row.extra || row.label || "").trim();
      const blobAll = (stage + " " + placeText + " " + valText + " " + comment).toLowerCase();

      /* ✅ CHANGED (CIV ONLY): Civ scoring BEFORE eligibleForScoring, because civ uses label (year/не защитился) */
      if (t === "Civilization: Solo" || t === "Civilization: DUEL"){
        const a = String(row.score_or_attendance ?? "").trim();
        if (a !== "0") return { points: null, explain: "Civ: не начисляем (нужно 0 в посещаемости)" };

        if (!isCivRevolutionRow(row)) return { points: null, explain: "Civ: не революция — не в зачёт" };

        const lbl = String(row.label ?? "").trim().toLowerCase();

        // Не защитился = 0
        if (lbl.includes("не защит")) {
          return { points: 0, explain: "Civ: не защитился → 0" };
        }

        // Защитился: 100 за революцию + 0..100 за год
        const y = parseYearFromRow(row);
        if (!y) return { points: null, explain: "Civ: нет года революции — баллы не посчитаны" };

        const yearPts = civYearPointsFromYear(y);
        const total = 100 + yearPts;
        return { points: total, explain: `Civ: революция 100 + год ${y} → ${yearPts} = ${total}` };
      }

      if (!eligibleForScoring(row)){
        return { points: null, explain: "Не начисляем: нет подтверждения участия (нужно 0 в посещаемости)" };
      }

      if (includesAny(stage, ["трен", "training"])) {
        return { points: null, explain: "Тренировочная — не в зачёт" };
      }

      if (t === "Business Cats"){
        if (!includesAny(stage, ["рейтинг", "рейтин", "rating"])) return { points: null, explain: "Не рейтинговая — не в зачёт" };

        const pRaw = String(placeText || "").trim();
        if (pRaw === "#Н/Д" || pRaw === "#N/A" || pRaw.toLowerCase().includes("н/д")){
          return { points: null, explain: "Нет места (#Н/Д) — не начисляем" };
        }

        const p = parsePlaceNumber(placeText) ?? parsePlaceNumber(comment);
        if (p === null) return { points: null, explain: "Нет места — баллы не посчитаны" };
        const pts = bcPointsFromPlace(p);
        return { points: pts, explain: `Business Cats: место ${p} → ${pts} баллов` };
      }

      if (t === "Пейнтбол"){
        if (includesAny(stage, ["групп", "group"])){
          const win = includesAny(blobAll, ["побед", "win"]);
          const lose = includesAny(blobAll, ["проиг", "loss", "пораж", "выбыл"]);
          if (win) return { points: 100, explain: "Пейнтбол (группа): Победа → 100" };
          if (lose) return { points: 0, explain: "Пейнтбол (группа): Поражение/выбыл → 0" };
          return { points: null, explain: "Пейнтбол (группа): нет результата" };
        }

        if (includesAny(blobAll, ["плей", "playoff", "1/", "1\\", "финал", "final", "1/32", "1/16", "1/8", "1/4", "1/2"])){
          const lose = includesAny(blobAll, ["выбыл", "проиг", "loss", "пораж"]);
          if (lose) return { points: 0, explain: "Пейнтбол (плей-офф): выбыл/проигрыш → 0" };

          const win = includesAny(blobAll, ["побед", "win"]);
          if (win) return { points: 100, explain: "Пейнтбол (плей-офф): Победа → 100" };

          const denom = extractPlayoffDenom(blobAll);
          if (denom){
            const pts = playoffRoundPoints(denom);
            if (pts !== null) return { points: pts, explain: `Пейнтбол (плей-офф): 1/${denom} → ${pts}` };
          }

          return { points: 0, explain: "Пейнтбол (плей-офф): выбыл/не распознан → 0" };
        }

        return { points: null, explain: "Пейнтбол: не зачётный этап" };
      }

      return { points: null, explain: "Пока не начисляем (добавим позже)" };
    }

    function computeScoredSessions(id){
      const sessions = DB.sessionsById.get(id) || [];
      const out = [];

      /* ✅ CHANGED (CIV ONLY): count civ revolution only once per tournament (Solo/Duel) */
      const civSeen = new Set();

      for (const s of sessions){
        const tKey = normTournamentKey(s.tournament);

        if ((tKey === "Civilization: Solo" || tKey === "Civilization: DUEL") && isCivRevolutionRow(s)){
          const a = String(s.score_or_attendance ?? "").trim();
          if (a === "0"){
            const key = tKey; // once per tournament
            if (civSeen.has(key)) continue;
            civSeen.add(key);
          }
        }

        const scored = scoreSession(s);
        if (typeof scored.points === "number" && Number.isFinite(scored.points)){
          out.push({
            ...s,
            tournamentKey: tKey,
            points: scored.points,
            explain: scored.explain
          });
        }
      }
      out.sort((a,b)=> (a.date || "").localeCompare(b.date || ""));
      return out;
    }

    function computeStudentTotalPoints(id){
      const scored = computeScoredSessions(id);
      return scored.reduce((sum, x)=> sum + (x.points || 0), 0);
    }

    function recomputeLeagues(){
      const ids = Array.from(DB.studentsById.keys()).filter(id=>{
        const st = DB.studentsById.get(id)?.status;
        return !isExpelledStatus(st);
      });

      const totals = ids.map(id => ({ id, total: computeStudentTotalPoints(id) }));
      totals.sort((a,b)=> b.total - a.total);

      const totalN = totals.length || 1;
      const goldN = Math.max(1, Math.ceil(totalN * 0.05));
      const silverN = Math.max(goldN, Math.ceil(totalN * 0.20));

      DB.totalsById.clear();
      DB.leagueById.clear();

      totals.forEach((x, idx)=>{
        DB.totalsById.set(x.id, x.total);
        let league = "Бронзовая";
        if (idx < goldN) league = "Золотая";
        else if (idx < silverN) league = "Серебряная";
        DB.leagueById.set(x.id, league);
      });

      DB.thresholds = { goldN, silverN, totalN };
    }

    function calcTrackers(student, sessions, scored){
      const attSessions = sessions.filter(s=> isAttendanceValue(s.score_or_attendance));
      const presentCount = attSessions.reduce((acc, s)=> acc + (attendanceIsPresent(s.score_or_attendance) === true ? 1 : 0), 0);
      const attTotal = attSessions.length || 0;
      const absences = Math.max(0, attTotal - presentCount);
      const attPercent = attTotal ? Math.round(presentCount / attTotal * 100) : 0;

      const pts = scored.map(s=>s.points||0).sort((a,b)=>a-b);
      const typical = pts.length ? pts[Math.floor(pts.length/2)] : 0;

      const last = scored.slice(-6);
      const recentAvg = last.length ? Math.round(last.reduce((a,x)=>a+(x.points||0),0)/last.length) : 0;

      return { attPercent, absences, typical, recentAvg };
    }

    function computeStrongSide(scored){
      const byT = new Map();
      for (const s of (scored || [])){
        const k = s.tournamentKey || normTournamentKey(s.tournament);
        if (!byT.has(k)) byT.set(k, []);
        byT.get(k).push(s.points || 0);
      }

      const stats = Array.from(byT.entries()).map(([k, arr])=>{
        const sum = arr.reduce((a,x)=>a+x,0);
        const avg = arr.length ? sum/arr.length : 0;
        const peak = arr.length ? Math.max(...arr) : 0;
        return { k, avg, peak, n: arr.length };
      }).sort((a,b)=> (b.avg - a.avg) || (b.peak - a.peak));

      if (!stats.length){
        return { text: "Пока нет зачётных результатов. Как только появятся — мы покажем вашу сильную сторону и точку роста.", badge:{text:"—", cls:"b-warn"} };
      }

      const top = stats[0];
      let badge = { text:"Сильная", cls:"b-ok" };
      if (top.avg < 60) badge = { text:"В рост", cls:"b-warn" };

      const text = (top.avg >= 75)
        ? `Лучше всего у вас получается этап «${top.k}». Продолжайте опираться на это — и переносите подход в другие этапы.`
        : `Сейчас лучший фокус для роста — этап «${top.k}». Стабильный план и регулярная практика помогут поднять результат.`;

      return { text, badge };
    }

    /* ----- Charts (same as your base) ----- */
    function setupCanvas(id){
      const c = document.getElementById(id);
      if (!c) return null;
      const ctx = c.getContext("2d");
      const dpr = window.devicePixelRatio || 1;
      const rect = c.getBoundingClientRect();
      const w = Math.floor(rect.width * dpr);
      const h = Math.floor(rect.height * dpr);
      if (c.width !== w || c.height !== h){
        c.width = w; c.height = h;
      }
      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(dpr, dpr);
      return { c, ctx, w: rect.width, h: rect.height };
    }

    function roundRect(ctx, x, y, w, h, r){
      const rr = Math.min(r, w/2, h/2);
      ctx.beginPath();
      ctx.moveTo(x+rr, y);
      ctx.arcTo(x+w, y, x+w, y+h, rr);
      ctx.arcTo(x+w, y+h, x, y+h, rr);
      ctx.arcTo(x, y+h, x, y, rr);
      ctx.arcTo(x, y, x+w, y, rr);
      ctx.closePath();
    }

    function drawDonut(id, present, absent){
      const pack = setupCanvas(id);
      if (!pack) return;
      const {ctx, w, h} = pack;
      ctx.clearRect(0,0,w,h);

      const cx = w/2, cy = h/2;
      const r = Math.min(w,h) * 0.32;
      const thick = Math.max(14, r*0.35);

      const total = Math.max(1, present + absent);
      const p = present / total;

      ctx.lineCap = "round";
      ctx.lineWidth = thick;

      ctx.strokeStyle = "rgba(255,255,255,.10)";
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.stroke();

      const start = -Math.PI/2;
      const end = start + Math.PI*2*p;
      const g = ctx.createLinearGradient(cx-r, cy, cx+r, cy);
      g.addColorStop(0, "rgba(124,92,255,.95)");
      g.addColorStop(1, "rgba(33,212,255,.55)");
      ctx.strokeStyle = g;

      ctx.beginPath();
      ctx.arc(cx, cy, r, start, end);
      ctx.stroke();

      ctx.fillStyle = "rgba(234,240,255,.95)";
      ctx.font = "900 28px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText(Math.round(p*100) + "%", cx, cy + 6);

      ctx.fillStyle = "rgba(169,180,214,.85)";
      ctx.font = "900 12px ui-sans-serif, system-ui";
      ctx.fillText("посещаемость", cx, cy + 28);
    }

    function drawProgressDots(id, scored){
      const pack = setupCanvas(id);
      if (!pack) return;
      const {ctx, w, h, c} = pack;
      ctx.clearRect(0,0,w,h);

      const padL = 44, padR = 16, padT = 16, padB = 28;
      const left = padL, right = w - padR;
      const top = padT, bottom = h - padB;

      const points = (scored || []).slice(-80);
      const n = Math.max(1, points.length);
      const xs = points.map((_,i)=> left + (i*(right-left)/Math.max(1,n-1)));

      const maxV = Math.max(100, ...points.map(p=>p.points||0), 1);
      const minV = 0;

      const ys = points.map(p=>{
        const v = clamp(p.points||0, minV, maxV);
        return bottom - ((v-minV)/(maxV-minV))*(bottom-top);
      });

      ctx.strokeStyle = "rgba(255,255,255,.10)";
      ctx.lineWidth = 1;
      ctx.fillStyle = "rgba(169,180,214,.85)";
      ctx.font = "900 12px ui-sans-serif, system-ui";
      ctx.textAlign = "right";

      const ticks = 4;
      for (let i=0;i<=ticks;i++){
        const tt = i/ticks;
        const y = top + tt*(bottom-top);
        const val = Math.round((1-tt)*maxV);
        ctx.beginPath();
        ctx.moveTo(left, y);
        ctx.lineTo(right, y);
        ctx.stroke();
        ctx.fillText(String(val), left-8, y+4);
      }

      if (points.length >= 2){
        ctx.beginPath();
        ctx.moveTo(xs[0], ys[0]);
        for (let i=1;i<points.length;i++) ctx.lineTo(xs[i], ys[i]);
        ctx.lineTo(xs[points.length-1], bottom);
        ctx.lineTo(xs[0], bottom);
        ctx.closePath();
        const g = ctx.createLinearGradient(0, top, 0, bottom);
        g.addColorStop(0, "rgba(124,92,255,.22)");
        g.addColorStop(1, "rgba(33,212,255,.06)");
        ctx.fillStyle = g;
        ctx.fill();
      }

      if (points.length >= 2){
        ctx.beginPath();
        ctx.moveTo(xs[0], ys[0]);
        for (let i=1;i<points.length;i++) ctx.lineTo(xs[i], ys[i]);
        ctx.strokeStyle = "rgba(234,240,255,.85)";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      c.__dots = [];
      for (let i=0;i<points.length;i++){
        const x = xs[i], y = ys[i];
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI*2);
        ctx.fillStyle = "rgba(33,212,255,.75)";
        ctx.fill();
        c.__dots.push({ x, y, r: 9, data: points[i] });
      }

      ctx.fillStyle = "rgba(169,180,214,.85)";
      ctx.font = "900 12px ui-sans-serif, system-ui";
      ctx.textAlign = "left";
      ctx.fillText("сессии (последние)", left, h - 8);
    }

    function drawActivityByDate(id, scored){
      const pack = setupCanvas(id);
      if (!pack) return;
      const {ctx, w, h, c} = pack;
      ctx.clearRect(0,0,w,h);

      const padL = 44, padR = 16, padT = 16, padB = 30;
      const left = padL, right = w - padR;
      const top = padT, bottom = h - padB;

      const m = new Map();
      for (const s of (scored || [])){
        const key = formatDateRU(s.date || "");
        if (key === "—") continue;
        m.set(key, (m.get(key)||0) + (s.points||0));
      }
      const items = Array.from(m.entries())
        .map(([date, pts])=>({ date, pts }))
        .sort((a,b)=>{
          const da = parseISODateMaybe(a.date) || new Date(0);
          const db = parseISODateMaybe(b.date) || new Date(0);
          return +da - +db;
        });

      const data = items.slice(-28);
      const n = Math.max(1, data.length);
      const maxV = Math.max(100, ...data.map(x=>x.pts), 1);

      ctx.strokeStyle = "rgba(255,255,255,.10)";
      ctx.lineWidth = 1;
      ctx.fillStyle = "rgba(169,180,214,.85)";
      ctx.font = "900 12px ui-sans-serif, system-ui";
      ctx.textAlign = "right";

      const ticks = 4;
      for (let i=0;i<=ticks;i++){
        const tt = i/ticks;
        const y = top + tt*(bottom-top);
        const val = Math.round((1-tt)*maxV);
        ctx.beginPath();
        ctx.moveTo(left, y);
        ctx.lineTo(right, y);
        ctx.stroke();
        ctx.fillText(String(val), left-8, y+4);
      }

      const gap = 10;
      const barW = Math.max(10, (right-left - gap*(n-1))/n);

      c.__bars = [];

      for (let i=0;i<data.length;i++){
        const x = left + i*(barW+gap);
        const v = data[i].pts;
        const bh = (v/maxV) * (bottom-top-8);
        const y = bottom - bh;

        const g = ctx.createLinearGradient(x, y, x, bottom);
        g.addColorStop(0, "rgba(124,92,255,.95)");
        g.addColorStop(1, "rgba(33,212,255,.55)");
        ctx.fillStyle = g;

        roundRect(ctx, x, y, barW, bh, 10);
        ctx.fill();

        ctx.fillStyle = "rgba(169,180,214,.85)";
        ctx.font = "12px ui-sans-serif, system-ui";
        ctx.textAlign = "center";
        const dLabel = data[i].date.slice(0,5);
        ctx.fillText(dLabel, x+barW/2, bottom+16);

        c.__bars.push({ x, y, w: barW, h: bh, date: data[i].date, value: v });
      }
    }

    function drawTop3(id, scored){
      const pack = setupCanvas(id);
      if (!pack) return;
      const {ctx, w, h, c} = pack;
      ctx.clearRect(0,0,w,h);

      const best = (scored || [])
        .slice()
        .sort((a,b)=> (b.points||0) - (a.points||0))
        .slice(0,3);

      const padL = 16, padR = 16, padT = 16, padB = 16;
      const left = padL, right = w - padR;
      const top = padT, bottom = h - padB;

      const rowH = (bottom - top) / 3;
      const maxV = Math.max(1, ...best.map(x=>x.points||0), 100);

      c.__bars = [];

      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = "rgba(255,255,255,.10)";
      ctx.lineWidth = 1;
      for (let i=0;i<3;i++){
        const y = top + i*rowH;
        ctx.beginPath();
        ctx.moveTo(left, y);
        ctx.lineTo(right, y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      for (let i=0;i<3;i++){
        const y0 = top + i*rowH + 10;
        const barH = Math.max(18, rowH - 20);

        const item = best[i];
        if (!item){
          ctx.fillStyle = "rgba(169,180,214,.75)";
          ctx.font = "900 13px ui-sans-serif, system-ui";
          ctx.textAlign = "left";
          ctx.fillText("—", left, y0 + barH/2 + 5);
          continue;
        }

        const v = item.points || 0;
        const barW = (right - left) * (v / maxV);

        const g = ctx.createLinearGradient(left, y0, left + barW, y0);
        g.addColorStop(0, "rgba(124,92,255,.95)");
        g.addColorStop(1, "rgba(33,212,255,.55)");
        ctx.fillStyle = g;

        roundRect(ctx, left, y0, Math.max(10, barW), barH, 12);
        ctx.fill();

        const title = `${item.tournamentKey || normTournamentKey(item.tournament)} • ${formatDateRU(item.date || "—")}`;
        const sub = `${item.stage || item.label || "—"} • ${item.place_or_result || item.score_or_attendance || "—"}`;

        ctx.fillStyle = "rgba(234,240,255,.95)";
        ctx.font = "1000 13px ui-sans-serif, system-ui";
        ctx.textAlign = "left";
        ctx.fillText(title, left + 12, y0 + 18);

        ctx.fillStyle = "rgba(169,180,214,.85)";
        ctx.font = "900 12px ui-sans-serif, system-ui";
        ctx.fillText(sub, left + 12, y0 + 36);

        ctx.fillStyle = "rgba(234,240,255,.95)";
        ctx.font = "1100 14px ui-sans-serif, system-ui";
        ctx.textAlign = "right";
        ctx.fillText(`${v} баллов`, right, y0 + 22);

        c.__bars.push({
          x:left, y:y0, w:Math.max(10, barW), h:barH,
          title, sub, value:v
        });
      }
    }

    function attachDotTooltip(canvasId){
      const c = document.getElementById(canvasId);
      if (!c) return;
      const tip = ensureTooltip();

      function getPos(e){
        const r = c.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }

      c.addEventListener("mousemove", (e)=>{
        const dots = c.__dots || [];
        const p = getPos(e);
        const hit = dots.find(d=>{
          const dx = p.x - d.x, dy = p.y - d.y;
          return (dx*dx + dy*dy) <= (d.r*d.r);
        });
        if (!hit){
          tip.style.display = "none";
          return;
        }
        const s = hit.data;
        const title = `${s.tournamentKey || normTournamentKey(s.tournament)} • ${formatDateRU(s.date || "—")}`;
        const stage = (s.stage || s.label || "—");
        const res = (s.place_or_result || s.score_or_attendance || "—");
        tip.innerHTML = `${esc(title)}<br><span style="color:rgba(169,180,214,.9)">${esc(stage)} • ${esc(res)}</span><br><b>${esc(s.points)} баллов</b>`;
        tip.style.display = "block";
        tip.style.left = (e.clientX + 12) + "px";
        tip.style.top = (e.clientY + 12) + "px";
      });

      c.addEventListener("mouseleave", ()=> tip.style.display = "none");
    }

    function attachBarTooltip(canvasId){
      const c = document.getElementById(canvasId);
      if (!c) return;
      const tip = ensureTooltip();

      function getPos(e){
        const r = c.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }

      c.addEventListener("mousemove", (e)=>{
        const bars = c.__bars || [];
        const p = getPos(e);
        const hit = bars.find(b=> p.x >= b.x && p.x <= b.x+b.w && p.y >= b.y && p.y <= b.y+b.h);
        if (!hit){
          tip.style.display = "none";
          return;
        }

        if (hit.date){
          tip.textContent = `${hit.date}: ${hit.value} баллов`;
        } else {
          tip.innerHTML = `${esc(hit.title)}<br><span style="color:rgba(169,180,214,.9)">${esc(hit.sub)}</span><br><b>${esc(hit.value)} баллов</b>`;
        }

        tip.style.display = "block";
        tip.style.left = (e.clientX + 12) + "px";
        tip.style.top = (e.clientY + 12) + "px";
      });

      c.addEventListener("mouseleave", ()=> tip.style.display = "none");
    }

    async function fetchTextOrThrow(url, label){
      let res;
      try{
        res = await fetch(url, { cache:"no-store" });
      }catch(e){
        throw new Error(`${label}: сеть/доступ заблокирован (${String(e?.message || e)})`);
      }
      if (!res.ok){
        throw new Error(`${label}: HTTP ${res.status} ${res.statusText}`);
      }
      const txt = await res.text();
      if (!String(txt).trim()){
        throw new Error(`${label}: файл пустой`);
      }
      return txt;
    }

    async function ensureDBLoaded(force=false){
      if (DB.loaded && !force) return true;
      if (DB.loading) return false;
      DB.loading = true;
      DB.loadError = "";

      try{
        const [stuTxt, sesTxt] = await Promise.all([
          fetchTextOrThrow(DATA_URLS.students, "site_students.csv"),
          fetchTextOrThrow(DATA_URLS.sessions, "site_sessions.csv"),
        ]);

        const stuRows = parseCSV(stuTxt);
        const sesRows = parseCSV(sesTxt);

        if (stuRows.length < 2) throw new Error("site_students.csv: мало строк (нет данных)");
        if (sesRows.length < 2) throw new Error("site_sessions.csv: мало строк (нет данных)");

        const stuHeader = stuRows.shift().map(normalizeHeader);
        const sesHeader = sesRows.shift().map(normalizeHeader);

        const s_id = findHeader(stuHeader, ["id"]);
        const s_nf = findHeader(stuHeader, ["name_full","фио","ф.и.о","ф.и.о.","фамилия имя"]);
        const s_ns = findHeader(stuHeader, ["name_short","кратко"]);
        const s_gr = findHeader(stuHeader, ["group","группа"]);
        const s_st = findHeader(stuHeader, ["status","статус","статус обучения"]);
        if (s_id < 0) throw new Error("students: нет колонки id");

        DB.studentsById.clear();
        for (const r of stuRows){
          const id = normalizeId(r[s_id]);
          if (!id) continue;
          DB.studentsById.set(id, {
            id,
            name_full: (s_nf >= 0 ? (r[s_nf] ?? "") : ""),
            name_short: (s_ns >= 0 ? (r[s_ns] ?? "") : ""),
            group: (s_gr >= 0 ? (r[s_gr] ?? "") : ""),
            status: (s_st >= 0 ? (r[s_st] ?? "") : ""),
          });
        }

        const c_id = findHeader(sesHeader, ["id"]);
        const c_t = findHeader(sesHeader, ["tournament","турнир"]);
        const c_stage = findHeader(sesHeader, ["stage","этап","стадия"]);
        const c_sno = findHeader(sesHeader, ["session_no","session","сессия"]);
        const c_gno = findHeader(sesHeader, ["game_no","game","игра"]);
        const c_date = findHeader(sesHeader, ["date","дата"]);
        const c_score = findHeader(sesHeader, ["score_or_attendance","score","очки","посещаемость","значение"]);
        const c_place = findHeader(sesHeader, ["place_or_result","place","место","результат"]);
        const c_comment = findHeader(sesHeader, ["comment","комментарий"]);
        const c_extra = findHeader(sesHeader, ["extra","доп"]);
        const c_label = findHeader(sesHeader, ["label","заголовок"]);

        if (c_id < 0) throw new Error("sessions: нет колонки id");
        if (c_t < 0) throw new Error("sessions: нет колонки tournament/турнир");
        if (c_stage < 0) throw new Error("sessions: нет колонки stage/этап");
        if (c_date < 0) throw new Error("sessions: нет колонки date/дата");

        DB.sessionsById.clear();

        for (const r of sesRows){
          const id = normalizeId(r[c_id]);
          if (!id) continue;

          const rowObj = {
            id,
            tournament: (c_t >= 0 ? (r[c_t] ?? "") : ""),
            stage: (c_stage >= 0 ? (r[c_stage] ?? "") : ""),
            session_no: (c_sno >= 0 ? (r[c_sno] ?? "") : ""),
            game_no: (c_gno >= 0 ? (r[c_gno] ?? "") : ""),
            date: (c_date >= 0 ? String(r[c_date] ?? "").trim() : ""),
            score_or_attendance: (c_score >= 0 ? String(r[c_score] ?? "").trim() : ""),
            place_or_result: (c_place >= 0 ? String(r[c_place] ?? "").trim() : ""),
            comment: (c_comment >= 0 ? String(r[c_comment] ?? "").trim() : ""),
            extra: (c_extra >= 0 ? String(r[c_extra] ?? "").trim() : ""),
            label: (c_label >= 0 ? String(r[c_label] ?? "").trim() : ""),
          };

          if (!DB.sessionsById.has(id)) DB.sessionsById.set(id, []);
          DB.sessionsById.get(id).push(rowObj);
        }

        for (const [id, arr] of DB.sessionsById){
          arr.sort((a,b)=> (a.date || "").localeCompare(b.date || ""));
        }

        DB.loaded = true;
        recomputeLeagues();
        return true;
      }catch(e){
        DB.loaded = false;
        DB.loadError = String(e?.message || e);
        return false;
      }finally{
        DB.loading = false;
      }
    }

    function parseHash(){
      const raw = (location.hash || "#/rating").replace("#", "");
      const [path, qs] = raw.split("?");
      const parts = path.split("/").filter(Boolean);
      const params = new URLSearchParams(qs || "");
      return { parts, params };
    }

    async function route(){
      const { parts, params } = parseHash();
      const page = parts[0] || "rating";

          renderAdminSkeleton();
          await ensureDBLoaded(false);
          renderAdmin();
        } else {
          showAdminLogin();
          location.hash = "#/rating";
        }
        return;
      }

      renderRatingSkeleton();
      await ensureDBLoaded(false);
      renderRating(params);
    }

    /* ── Admin canvas charts ──────────────────────────── */
    function drawAdminLeagueDonut(id, segs){
      // segs: [{n, color, label}]
      const pack = setupCanvas(id);
      if (!pack) return;
      const {ctx, w, h} = pack;
      ctx.clearRect(0,0,w,h);
      const cx = w/2, cy = h/2;
      const r = Math.min(w,h)*0.36;
      const thick = Math.max(10, r*0.38);
      const total = Math.max(1, segs.reduce((a,s)=>a+s.n,0));
      ctx.lineCap = "butt"; ctx.lineWidth = thick;
      ctx.strokeStyle = "rgba(255,255,255,.08)";
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
      let angle = -Math.PI/2;
      for (const seg of segs){
        if (!seg.n) continue;
        const sweep = (seg.n/total)*Math.PI*2;
        ctx.strokeStyle = seg.color;
        ctx.beginPath(); ctx.arc(cx,cy,r,angle,angle+sweep-0.04); ctx.stroke();
        angle += sweep;
      }
      const isLight = document.body.classList.contains("light");

    function drawAdminRadar(id, labels, values){
      const pack = setupCanvas(id);
      if (!pack) return;
      const {ctx, w, h} = pack;
      ctx.clearRect(0,0,w,h);
      const n = labels.length;
      const cx = w/2, cy = h/2 + 10;
      const maxR = Math.min(w,h)*0.30;
      const isLight = document.body.classList.contains("light");
      const gridColor = isLight ? "rgba(0,0,0,.10)" : "rgba(255,255,255,.10)";
      const labelColor = isLight ? "rgba(91,63,255,.9)" : "rgba(33,212,255,.9)";
      const mutedColor = isLight ? "rgba(90,100,133,.6)" : "rgba(169,180,214,.55)";
      ctx.lineWidth = 1;
      for (const f of [0.25,0.5,0.75,1]){
        ctx.beginPath();
        for (let i=0;i<n;i++){
          const a=(i/n)*Math.PI*2-Math.PI/2;
          const x=cx+Math.cos(a)*maxR*f, y=cy+Math.sin(a)*maxR*f;
          i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
        }
        ctx.closePath();
        ctx.strokeStyle = gridColor; ctx.stroke();
        if (f<1){
          ctx.fillStyle=mutedColor; ctx.font="9px sans-serif"; ctx.textAlign="center";
          ctx.fillText(Math.round(f*100)+"%",cx,cy-maxR*f-3);
        }
      }
      for (let i=0;i<n;i++){
        const a=(i/n)*Math.PI*2-Math.PI/2;
        ctx.beginPath(); ctx.moveTo(cx,cy);
        ctx.lineTo(cx+Math.cos(a)*maxR,cy+Math.sin(a)*maxR);
        ctx.strokeStyle=gridColor; ctx.stroke();
        const lx=cx+Math.cos(a)*(maxR+20), ly=cy+Math.sin(a)*(maxR+20);
        ctx.fillStyle=labelColor; ctx.font="bold 10px sans-serif";
        ctx.textAlign=Math.abs(Math.cos(a))<0.15?"center":Math.cos(a)<0?"right":"left";
        ctx.textBaseline="middle";
        ctx.fillText(labels[i],lx,ly);
      }
      // data shape
      ctx.beginPath();
      for (let i=0;i<n;i++){
        const a=(i/n)*Math.PI*2-Math.PI/2;
        const rv=maxR*(values[i]||0)/100;
        i===0?ctx.moveTo(cx+Math.cos(a)*rv,cy+Math.sin(a)*rv)
             :ctx.lineTo(cx+Math.cos(a)*rv,cy+Math.sin(a)*rv);
      }
      ctx.closePath();
      ctx.fillStyle="rgba(124,92,255,.25)"; ctx.fill();
      ctx.strokeStyle="rgba(124,92,255,.75)"; ctx.lineWidth=2; ctx.stroke();
      // dots
      for (let i=0;i<n;i++){
        const a=(i/n)*Math.PI*2-Math.PI/2;
        const rv=maxR*(values[i]||0)/100;
        ctx.beginPath();
        ctx.arc(cx+Math.cos(a)*rv,cy+Math.sin(a)*rv,3,0,Math.PI*2);
        ctx.fillStyle="#7c5cff"; ctx.fill();
      }
    }

    function drawAdminAttByTournament(id, attData){
      // attData: [{label, present, total, color}]
      const pack = setupCanvas(id);
      if (!pack) return;
      const {ctx, w, h} = pack;
      ctx.clearRect(0,0,w,h);
      if (!attData.length){ return; }
      const isLight = document.body.classList.contains("light");
      const textColor = isLight ? "rgba(90,100,133,.7)" : "rgba(169,180,214,.7)";
      const pad={l:10,r:10,t:14,b:60};
      const cw=w-pad.l-pad.r, ch=h-pad.t-pad.b;
      const bw=cw/attData.length*0.55;
      const gap=cw/attData.length;
      const maxV=100;
      // grid
      for (let i=0;i<=4;i++){
        const y=pad.t+ch-(i/4)*ch;
        ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y);
        ctx.strokeStyle=isLight?"rgba(0,0,0,.06)":"rgba(255,255,255,.06)"; ctx.lineWidth=1; ctx.stroke();
        ctx.fillStyle=textColor; ctx.font="9px sans-serif"; ctx.textAlign="right";
        ctx.fillText((i*25)+"%", pad.l-2, y+3);
      }
      for (let i=0;i<attData.length;i++){
        const d=attData[i];
        const pct=d.total?Math.round(d.present/d.total*100):0;
        const barH=(pct/maxV)*ch;
        const x=pad.l+i*gap+gap/2-bw/2;
        const y=pad.t+ch-barH;
        // bg bar
        ctx.fillStyle=isLight?"rgba(0,0,0,.05)":"rgba(255,255,255,.05)";
        roundRect(ctx,x,pad.t,bw,ch,4); ctx.fill();
        // fill bar
        const g=ctx.createLinearGradient(0,y,0,pad.t+ch);
        g.addColorStop(0,d.color); g.addColorStop(1,d.color+"66");
        ctx.fillStyle=g;
        roundRect(ctx,x,y,bw,Math.max(barH,2),4); ctx.fill();
        // pct label on bar
        if (pct>8){
          ctx.fillStyle="#fff"; ctx.font="bold 9px sans-serif"; ctx.textAlign="center";
          ctx.fillText(pct+"%", x+bw/2, y+12);
        }
        // bottom label
        ctx.fillStyle=textColor; ctx.font="bold 9px sans-serif"; ctx.textAlign="center";
        const lbl=d.label.length>8?d.label.slice(0,8)+"…":d.label;
        ctx.fillText(lbl, pad.l+i*gap+gap/2, h-pad.b+13);
        ctx.fillStyle=textColor; ctx.font="9px sans-serif";
        ctx.fillText(d.present+"/"+d.total, pad.l+i*gap+gap/2, h-pad.b+25);
      }
    }

    // entries: [{label, value, color}] — горизонтальный бар-чарт
    function drawHorizBars(id, entries){

    // yearEntries: [[year, count], ...] — гистограмма лет революций CIV
    function drawCIVYearsChart(id, yearEntries){
      const pack = setupCanvas(id);
      if (!pack) return;
      const {ctx, w, h} = pack;
      ctx.clearRect(0,0,w,h);
      if (!yearEntries.length){
        ctx.fillStyle="rgba(169,180,214,.5)"; ctx.font="13px sans-serif";
        ctx.textAlign="center"; ctx.fillText("Нет данных", w/2, h/2); return;
      }
      const isLight = document.body.classList.contains("light");
      const textColor = isLight ? "rgba(90,100,133,.7)" : "rgba(169,180,214,.7)";
      const maxV = Math.max(...yearEntries.map(e=>e[1]), 1);
      const pad={l:10,r:10,t:20,b:36};
      const cw=w-pad.l-pad.r, ch=h-pad.t-pad.b;
      const gap=cw/yearEntries.length;
      const bw=Math.min(gap*0.85, 28);
      for (let i=0;i<yearEntries.length;i++){
        const [year, cnt]=yearEntries[i];
        const barH=(cnt/maxV)*ch;
        const x=pad.l+i*gap+gap/2-bw/2;
        const y=pad.t+ch-barH;
        // colour: early year (1652)=gold → late (1800)=purple
        const t=clamp((year-1652)/(1800-1652),0,1);
        const r=Math.round(246+(124-246)*t);
        const g=Math.round(195+(92-195)*t);
        const b=Math.round(67+(255-67)*t);
        const color=`rgb(${r},${g},${b})`;
        const colorFade=`rgba(${r},${g},${b},0.33)`;
        const grad=ctx.createLinearGradient(0,y,0,pad.t+ch);
        grad.addColorStop(0,color); grad.addColorStop(1,colorFade);
        ctx.fillStyle=grad;
        roundRect(ctx,x,y,bw,Math.max(barH,2),3); ctx.fill();
        if(cnt>0 && barH>14){
          ctx.fillStyle="#fff"; ctx.font="bold 9px sans-serif"; ctx.textAlign="center";
          ctx.fillText(cnt, x+bw/2, y+12);
        }
        ctx.fillStyle=textColor; ctx.font="9px sans-serif"; ctx.textAlign="center";
        ctx.fillText(year, x+bw/2, h-pad.b+13);
      }
    }

    function renderAdmin(){
      /* ══ Вычисляем статистику из CSV ══════════════════ */
      const totalStudents = DB.studentsById.size;
      const activeCount   = Array.from(DB.studentsById.values()).filter(s=>!isExpelledStatus(s.status)).length;
      const expelledCount = totalStudents - activeCount;

      let goldCount=0, silverCount=0, bronzeCount=0;
      DB.leagueById.forEach(l=>{ if(l==="Золотая") goldCount++; else if(l==="Серебряная") silverCount++; else bronzeCount++; });

      // Посещаемость и зачётные сессии по всем турнирам
      let totalAtt=0, totalPresent=0;
      const attByT   = new Map(); // tk -> {present,total}
      const scoredByT = new Map(); // tk -> [{...session, id, student}]

      DB.sessionsById.forEach((sessions,id)=>{
        if(isExpelledStatus(DB.studentsById.get(id)?.status)) return;
        sessions.forEach(s=>{
          if(isAttendanceValue(s.score_or_attendance)){
            totalAtt++;
            if(attendanceIsPresent(s.score_or_attendance)===true) totalPresent++;
            const tk=normTournamentKey(s.tournament);
            if(!attByT.has(tk)) attByT.set(tk,{present:0,total:0});
            const a=attByT.get(tk); a.total++;
            if(attendanceIsPresent(s.score_or_attendance)===true) a.present++;
          }
        });
        computeScoredSessions(id).forEach(s=>{
          const tk=s.tournamentKey;
          if(!scoredByT.has(tk)) scoredByT.set(tk,[]);
          scoredByT.get(tk).push({...s, id, student:DB.studentsById.get(id)});
        });
      });

      const avgAttPct = totalAtt?Math.round(totalPresent/totalAtt*100):0;
      const totalScoredCount = Array.from(scoredByT.values()).reduce((a,v)=>a+v.length,0);

      // Лидирующая группа (по среднему числу баллов)
      const groupStats=new Map();
      DB.studentsById.forEach((student,id)=>{
        if(isExpelledStatus(student.status)) return;
        const grp=(student.group||"").trim(); if(!grp||grp==="-") return;
        const pts=DB.totalsById.get(id)||0;
        if(!groupStats.has(grp)) groupStats.set(grp,{pts:[],n:0});
        groupStats.get(grp).pts.push(pts); groupStats.get(grp).n++;
      });
      let leadingGroup="—", leadingGroupAvg=0;
      groupStats.forEach((s,grp)=>{ const avg=s.pts.reduce((a,b)=>a+b,0)/s.pts.length; if(avg>leadingGroupAvg){leadingGroupAvg=avg;leadingGroup=grp;} });

      // Топ-10 студентов
      const topStudents=Array.from(DB.studentsById.keys())
        .filter(id=>!isExpelledStatus(DB.studentsById.get(id)?.status))
        .map(id=>({id,total:DB.totalsById.get(id)||0,s:DB.studentsById.get(id)}))
        .sort((a,b)=>b.total-a.total).slice(0,10);

      const tColors={"Business Cats":"#ff4d6d","Пейнтбол":"#25c26e","Civilization: Solo":"#7c5cff","Civilization: DUEL":"#21d4ff","Бенди":"#f6c343","Life is Feudal":"#cd7f32"};
      const tIcons ={"Business Cats":"🐱","Пейнтбол":"🔫","Civilization: Solo":"⚔","Civilization: DUEL":"⚔","Бенди":"🏒","Life is Feudal":"🏰"};

      });

}

      function initSlides(){
        const slider = document.getElementById("heroSlider");
        const caption = document.getElementById("heroCaption");
        const dotsWrap = document.getElementById("heroDots");
        if (!slider || !caption || !dotsWrap) return;

        const slides = Array.from(slider.querySelectorAll(".heroSlide"));
        const dots = Array.from(dotsWrap.querySelectorAll(".heroDot"));
        let idx = 0;
        let timer = null;

        function setSlide(i){
          idx = (i + SLIDES.length) % SLIDES.length;
          slides.forEach((el, k)=> el.classList.toggle("active", k===idx));
          dots.forEach((el, k)=> el.classList.toggle("active", k===idx));
          caption.textContent = SLIDES[idx].label;
        }

        function start(){
          stop();
          timer = setInterval(()=> setSlide(idx+1), 4200);
        }
        function stop(){
          if (timer) clearInterval(timer);
          timer = null;
        }

        dotsWrap.addEventListener("click", (e)=>{
          const d = e.target.closest(".heroDot");
          if (!d) return;
          setSlide(Number(d.getAttribute("data-i")));
          start();
        });

        slider.addEventListener("mouseenter", stop);
        slider.addEventListener("mouseleave", start);

        start();
      }

      async function show(){
        const id = normalizeId(idInput.value);

        if (!DB.loaded && !DB.loading){
          out.innerHTML = `<div class="notice">Загружаю данные…</div>`;
          await ensureDBLoaded(false);
        }

        if (!DB.loaded){
          out.innerHTML = `
            <div class="notice bad">
              CSV не загрузились: <b>${esc(DB.loadError || "неизвестная ошибка")}</b>
            </div>
          `;
          return;
        }

        if (!id){
          out.innerHTML = `<div class="notice bad">Введите ID (4 цифры).</div>`;
          return;
        }

        // ✅ SECRET: 9999 — топ лучших (только обучающиеся)
        if (id === "9999") {
          const activeIds = Array.from(DB.studentsById.keys())
            .filter(sid => !isExpelledStatus(DB.studentsById.get(sid)?.status));

          const ranking = activeIds
            .map(sid => ({
              id: sid,
              total: computeStudentTotalPoints(sid),
              student: DB.studentsById.get(sid)
            }))
            .sort((a,b)=> b.total - a.total);

          const TOP_N = 25;
          const top = ranking.slice(0, TOP_N);

          out.innerHTML = html`
            <div class="notice ok">Топ-${esc(TOP_N)} участников (только обучающиеся)</div>
            <div class="chartCard" style="margin-top:12px">
              <p class="chartTitle">Топ лучших игроков</p>
              <table class="table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Участник</th>
                    <th>ID</th>
                    <th>Группа</th>
                    <th>Лига</th>
                    <th>Баллы</th>
                  </tr>
                </thead>
                <tbody>
                  ${
                    top.length
                      ? top.map((x, i) => {
                          const league = DB.leagueById.get(x.id) || "Бронзовая";
                          const b = leagueBadge(league);
                          return html`
                            <tr>
                              <td><b>${esc(i+1)}</b></td>
                              <td><b>${esc((x.student?.name_short || "—").toString().trim() || "—")}</b></td>
                              <td class="muted">${esc(x.id)}</td>
                              <td class="muted">${esc((x.student?.group || "—").toString().trim() || "—")}</td>
                              <td><span class="badge ${esc(b.cls)}">${esc(b.label)}</span></td>
                              <td><b>${esc(x.total)}</b></td>
                            </tr>
                          `;
                        }).join("")
                      : `<tr><td colspan="6" class="muted">Нет данных для рейтинга.</td></tr>`
                  }
                </tbody>
              </table>
            </div>
          `;

          const rows = out.querySelectorAll("tbody tr");
          rows.forEach((tr, idx)=>{
            const rec = top[idx];
            if (!rec) return;
            tr.style.cursor = "pointer";
            tr.addEventListener("click", ()=>{
              idInput.value = rec.id;
              renderPreIntroIfNeeded();
              show();
            });
          });
          return;
        }

        const student = DB.studentsById.get(id);
        const sessions = DB.sessionsById.get(id) || [];
        if (!student){
          out.innerHTML = `<div class="notice bad">Студент с ID <b>${esc(id)}</b> не найден.</div>`;
          return;
        }

        const isExpelled = isExpelledStatus(student.status);

        const attSessions = sessions.filter(s=> isAttendanceValue(s.score_or_attendance));
        const presentCount = attSessions.reduce((acc, s)=> acc + (attendanceIsPresent(s.score_or_attendance) === true ? 1 : 0), 0);
        const attTotal = attSessions.length || 0;
        const absences = Math.max(0, attTotal - presentCount);
        const attPercent = attTotal ? Math.round(presentCount / attTotal * 100) : 0;

        const riskByAbsences = absences >= 4 ? {t:"Риск", cls:"b-warn"} : {t:"Норма", cls:"b-ok"};

        const scored = computeScoredSessions(id);
        const totalPoints = scored.reduce((sum,x)=> sum + (x.points || 0), 0);

        const league = DB.leagueById.get(id) || "Бронзовая";
        const rankPlace = getRankPlaceOnly(id);

        const track = calcTrackers(student, sessions, scored);
        const advice = buildAdvice(track);

        const strong = computeStrongSide(scored);
        advice.push({
          title: "Сильная сторона",
          text: strong.text,
          tag: strong.badge.text,
          cls: strong.badge.cls
        });

        /* ✅ IMPORTANT:
           Здесь — базовая раскладка дашборда (без фото/слайдера).
           Слайдер показывается только когда ID пустой. */
        out.innerHTML = html`
          <div class="notice ${isExpelled ? "expelled" : "ok"}">
            <b>${esc(student.name_short || student.name_full || "Студент")}</b> ·
            ID: <b>${esc(student.id)}</b> ·
            Группа: <b>${esc(student.group || "—")}</b>
            ${student.status ? ` · Статус: <b>${esc(student.status)}</b>` : ""}
          </div>

          <div class="notice" style="margin-top:10px">
            Баллы и дашборд ведутся <b>исключительно для информационных целей</b> и <b>не влияют</b> на выплаты/начисления.
          </div>

          <div class="kpiGrid">
            <div class="kpi">
              <div class="k">Лига</div>
              <div class="v">${leagueText(league)}</div>
            </div>
            <div class="kpi">
              <div class="k">Баллы (сумма)</div>
              <div class="v">${esc(totalPoints)}</div>
              <div class="c">За зачётные сессии</div>
            </div>
            <div class="kpi">
              <div class="k">Посещаемость</div>
              <div class="v">${esc(attPercent)}%</div>
              <div class="c"><span class="badge ${esc(riskByAbsences.cls)}">${esc(riskByAbsences.t)}</span> · прогулов: ${esc(absences)}</div>
            </div>
            <div class="kpi">
              <div class="k">Позиция в общем зачёте</div>
              <div class="v">${esc(rankPlace)}</div>
              <div class="c">место по сумме баллов</div>
            </div>
          </div>

          <div class="dash">
            <div class="chartCard">
              <p class="chartTitle">Прогресс по этапам</p>
              <canvas id="progressChart" width="900" height="320"></canvas>
              <div class="small">Точки = зачётные сессии (наведи — увидишь игру/этап/результат).</div>
            </div>
            <div class="chartCard">
              <p class="chartTitle">Посещаемость</p>
              <canvas id="attChart" width="600" height="320"></canvas>
              <div class="small">Присутствовал: ${esc(presentCount)} из ${esc(attTotal)} · прогулов: ${esc(absences)}</div>
            </div>
          </div>

          <div class="chartRow">
            <div class="chartCard" style="grid-column:1; grid-row:1;">
              <p class="chartTitle">Активность по времени (баллы по датам)</p>
              <canvas id="activityChart" width="900" height="320"></canvas>
              <div class="small">Сумма баллов за день (последние 28 дат с баллами).</div>
            </div>

            <div class="chartCard" style="grid-column:1; grid-row:2;">
              <p class="chartTitle">Топ-3 сильных результата</p>
              <canvas id="top3Chart" width="900" height="240"></canvas>
            </div>

            <div class="chartCard" style="grid-column:2; grid-row:1 / span 2;">
              <p class="chartTitle">Рекомендации по улучшению результата</p>
              <div style="display:grid; gap:10px">
                ${advice.map(a=>html`
                  <div style="padding:12px 12px; border-radius:16px; border:1px solid rgba(255,255,255,.10); background: rgba(255,255,255,.02)">
                    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px">
                      <div style="font-weight:1100">${esc(a.title)}</div>
                      <span class="badge ${esc(a.cls)}">${esc(a.tag)}</span>
                    </div>
                    <div class="muted" style="margin-top:6px; font-weight:800; line-height:1.6">
                      ${esc(a.text)}
                    </div>
                  </div>
                `).join("")}
              </div>
            </div>
          </div>

          <div class="chartCard" style="margin-top:12px">
            <p class="chartTitle">Начисление баллов</p>
            <table class="table">
              <thead>
                <tr>
                  <th>Дата</th>
                  <th>Этап</th>
                  <th>Сессия</th>
                  <th>Результат/место</th>
                  <th>Баллы</th>
                  <th>Как посчитали</th>
                </tr>
              </thead>
              <tbody>
                ${
                  scored.length
                    ? scored.map(s=>html`
                      <tr>
                        <td>${esc(formatDateRU(s.date || "—"))}</td>
                        <td><b>${esc(s.tournamentKey)}</b></td>
                        <td class="muted">${esc(s.stage || s.label || "—")}</td>
                        <td class="muted">${esc(s.place_or_result || s.score_or_attendance || "—")}</td>
                        <td><b>${esc(s.points)}</b></td>
                        <td class="muted">${esc(s.explain)}</td>
                      </tr>
                    `).join("")
                    : `<tr><td colspan="6" class="muted">Нет зачётных сессий.</td></tr>`
                }
              </tbody>
            </table>
          </div>

          <div class="chartCard" style="margin-top:12px">
            <p class="chartTitle">Все сессии студента</p>
            <table class="table">
              <thead>
                <tr>
                  <th>Дата</th>
                  <th>Турнир</th>
                  <th>Этап</th>
                  <th>Сессия</th>
                  <th>Игра</th>
                  <th>Посещаемость</th>
                  <th>Место/Результат</th>
                  <th>Комментарий</th>
                </tr>
              </thead>
              <tbody>
                ${
                  sessions.length
                    ? sessions.map(s=>html`
                      <tr>
                        <td>${esc(formatDateRU(s.date || "—"))}</td>
                        <td><b>${esc(normTournamentKey(s.tournament))}</b></td>
                        <td class="muted">${esc(s.stage || s.label || "—")}</td>
                        <td class="muted">${esc(s.session_no || "—")}</td>
                        <td class="muted">${esc(s.game_no || "—")}</td>
                        <td class="muted">${esc(s.score_or_attendance || "—")}</td>
                        <td class="muted">${esc(s.place_or_result || "—")}</td>
                        <td class="muted">${esc(s.comment || s.extra || "")}</td>
                      </tr>
                    `).join("")
                    : `<tr><td colspan="8" class="muted">Нет записей.</td></tr>`
                }
              </tbody>
            </table>
          </div>
        `;

        drawProgressDots("progressChart", scored);
        attachDotTooltip("progressChart");

        drawDonut("attChart", presentCount, Math.max(0, attTotal - presentCount));

        drawActivityByDate("activityChart", scored);
        attachBarTooltip("activityChart");

        drawTop3("top3Chart", scored);
        attachBarTooltip("top3Chart");
      }

      btnShow.addEventListener("click", show);
      idInput.addEventListener("keydown", (e)=>{ if (e.key==="Enter") show(); });

      if (presetId) idInput.value = presetId.replace(/\D/g,"").slice(0,4);

      // Показать слайды сразу (пока ID пустой)
      renderPreIntroIfNeeded();
    }

    window.addEventListener("load", async ()=>{
      if (!location.hash) location.hash = "#/rating";
      await route();
    });
  </script>
</body>
</html>
